<!DOCTYPE html>
<html lang="ja" class="mode-desktop">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>外務員暗記道場</title>
<script>(function(){var m=null;try{m=localStorage.getItem('gaimuin_display_mode');}catch(e){}if(m!=='mobile'&&m!=='desktop'){var w=Math.min(window.innerWidth||9999,(window.screen&&screen.width)||9999);m=w<=660?'mobile':'desktop';}document.documentElement.className='mode-'+m;})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F6F1E6;--paper-deep:#ECE3D0;--ink:#222A3D;--ink-soft:#5B5A50;--gold:#B8923C;--hanko:#AE3B33;--seal:#3F6E5E;--line:#D8CDB6;--unseen:#A39A86;--wakaranai:#B87B2A;--card:#FFFDF8}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;font-size:15px;line-height:1.7;touch-action:manipulation;overflow-wrap:anywhere}
body.noscroll{overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
.muted{color:var(--ink-soft);font-size:13px;margin:0}
/* header */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--ink);color:var(--paper)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-seal{width:34px;height:34px;border-radius:50%;background:var(--hanko);color:#fff;display:grid;place-items:center;font-family:'Shippori Mincho',serif;font-weight:700;font-size:17px;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3)}
.brand-name{font-family:'Shippori Mincho',serif;font-size:19px;font-weight:700;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode-btn{flex:none;background:transparent;border:1px solid rgba(246,241,230,.45);color:var(--paper);border-radius:999px;padding:4px 12px;font-size:12px;white-space:nowrap}
/* layout */
.layout{display:flex;flex-direction:row;align-items:flex-start;gap:28px;max-width:1060px;margin:0 auto;padding:24px 20px 48px}
.sidebar{width:270px;flex:none;position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto}
#main{flex:1;min-width:0;max-width:720px;width:100%}
.mode-mobile .layout{display:flex;flex-direction:column;align-items:stretch;padding:14px 12px calc(100px + env(safe-area-inset-bottom))}
.mode-mobile .sidebar{display:none}
.mode-mobile #main{max-width:none}
.mode-desktop .bottomnav{display:none}
.stamp{--c:var(--hanko);width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:'Shippori Mincho',serif;font-weight:700;font-size:13px;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.28)}
/* sidebar */
.side-mod{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:12px;padding:10px;margin-bottom:6px}
.side-mod:hover{background:var(--paper-deep)}
.side-mod.active{background:var(--card);border-color:var(--line);box-shadow:0 1px 4px rgba(34,42,61,.06)}
.sm-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.sm-label{font-weight:700;font-size:14px}
.sm-count{font-size:12px;color:var(--ink-soft)}
.side-menu{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
/* bottom nav */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:2px;background:rgba(246,241,230,.97);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(34,42,61,.08)}
.bn-item{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:none;padding:5px 2px;border-radius:12px}
.bn-item .stamp{width:30px;height:30px;font-size:13px}
.bn-item.wide{flex:1.6}
.bn-item.active{background:var(--paper-deep)}
.bn-label{font-size:11px;font-weight:700;line-height:1.3;white-space:nowrap}
.bn-count{font-size:10px;color:var(--ink-soft);line-height:1.2;white-space:nowrap}
.bn-more{width:30px;height:30px;display:grid;place-items:center;font-size:20px;font-weight:700;color:var(--ink-soft)}
/* panel */
.panel{display:block}
.panel-head{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.stamp.lg{width:48px;height:48px;font-size:20px}
.stamp.sm{width:24px;height:24px;font-size:11px}
.ph-text{min-width:0}
.panel-kicker{font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:.08em}
.panel-title{font-family:'Shippori Mincho',serif;font-size:22px;font-weight:700;line-height:1.3}
.panel-sub{font-size:12px;color:var(--ink-soft)}
.tabs{display:flex;gap:4px;background:var(--paper-deep);padding:4px;border-radius:12px;margin-bottom:16px}
.tab{flex:1;min-width:0;border:none;background:none;padding:8px 2px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.tab.active{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(34,42,61,.12)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.sec-h{font-family:'Shippori Mincho',serif;font-weight:700;font-size:16px;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.sec-h::before{content:'';width:4px;height:16px;border-radius:2px;background:var(--gold);flex:none}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.stat{text-align:center;padding:10px 2px;border-radius:10px;background:var(--paper)}
.stat b{display:block;font-family:'Shippori Mincho',serif;font-size:24px;line-height:1.2}
.stat span{font-size:11px;color:var(--ink-soft);white-space:nowrap}
.stat.known b{color:var(--seal)}.stat.weak b{color:var(--hanko)}.stat.unseen b{color:var(--unseen)}
.bar{height:8px;background:var(--paper-deep);border-radius:99px;overflow:hidden;display:flex}
.bar.big{height:10px}
.bar i{display:block;height:100%}
.bar .k{background:var(--seal)}.bar .w{background:var(--hanko)}.bar .p{background:var(--gold)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--ink-soft);margin-top:8px;flex-wrap:wrap}
.legend span::before{content:'';display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;background:var(--lc)}
.start-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-weight:700;font-size:14px;line-height:1.4}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.danger{color:var(--hanko);border-color:rgba(174,59,51,.4)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.block{display:block;width:100%;text-align:center}
.mt{margin-top:10px}
.start-btn{text-align:left;min-height:66px}
.start-btn small{display:block;font-weight:400;font-size:12px;color:var(--ink-soft);margin-top:2px}
.start-btn.primary small{color:rgba(246,241,230,.75)}
.resume{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(184,146,60,.12);border:1px solid rgba(184,146,60,.5);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.resume .btn{padding:6px 14px;flex:none}
.ch-card{padding:6px 14px}
.ch-row{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px dashed var(--line);padding:10px 0}
.ch-row:last-child{border-bottom:none}
.ch-top{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:6px}
.ch-name{flex:1;min-width:0;font-weight:600}
.ch-num{color:var(--ink-soft);white-space:nowrap;flex:none;font-size:12.5px}
.ch-sub{display:block;font-size:11px;color:var(--ink-soft);margin-top:3px}
.arrows{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin-top:16px}
.arrows .btn{padding:10px 8px;font-size:13px}
.side-sep{height:1px;background:var(--line);margin:6px 0 10px}
.pick-list{display:flex;flex-direction:column}
.pick-row{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:6px}
.pick-row.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.pick-row .sm-label{font-size:13.5px}
.rc-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.rc-row:last-child{border-bottom:none}
.rc-name{flex:1;min-width:0}
.rc-num{font-weight:700;color:var(--seal);white-space:nowrap}
.rc-num.ng{color:var(--hanko)}
/* items */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;font-size:16px;margin-bottom:10px}
.ch-head{display:flex;align-items:center;gap:8px;font-family:'Shippori Mincho',serif;font-weight:700;font-size:14px;margin:18px 2px 8px;color:var(--ink)}
.item{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--unseen);border-radius:12px;padding:12px 12px 10px;margin-bottom:10px}
.item.s-weak{border-left-color:var(--hanko)}.item.s-known{border-left-color:var(--seal)}
.item-top{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--ink-soft);margin-bottom:4px;flex-wrap:wrap}
.rlist .tag{margin-right:2px}
.tag{background:var(--paper-deep);border-radius:6px;padding:0 6px;font-size:11px}
.tag.c{background:rgba(184,146,60,.18);color:#7d5f1f}
.tag.warn{background:rgba(174,59,51,.1);color:var(--hanko)}
.item-text{font-size:14.5px;line-height:1.75;white-space:pre-wrap}
.item-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:1;max-width:280px}
.seg button{flex:1;border:none;background:var(--card);padding:6px 4px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--ink-soft)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on.weak{background:var(--hanko);color:#fff}.seg button.on.known{background:var(--seal);color:#fff}.seg button.on.unseen{background:var(--unseen);color:#fff}
.edit-btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 12px;font-size:12px;font-weight:600;flex:none}
.add-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
/* quiz */
.q-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-soft);margin-bottom:6px;gap:8px}
.q-card{min-height:150px;display:flex;flex-direction:column;justify-content:center;margin-top:12px}
.q-card{border-top:5px solid var(--c)}
.q-ch{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.q-chno{background:var(--c);color:#fff;border-radius:6px;padding:1px 9px;font-size:13px;font-weight:700;white-space:nowrap}
.q-chtitle{font-size:13px;font-weight:700;color:var(--c)}
.q-st{font-size:16.5px;line-height:1.85;white-space:pre-wrap}
.ans-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ans{height:78px;border:none;border-radius:16px;color:#fff;font-size:36px;font-family:'Shippori Mincho',serif;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.ans:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.ans.o{background:var(--seal)}.ans.x{background:var(--hanko)}
.ans.skip{grid-column:1/-1;height:54px;font-size:15px;font-family:inherit;background:var(--wakaranai)}
.fb{border-radius:14px;padding:14px 16px;margin-bottom:12px;border:1px solid}
.fb.ok{background:rgba(63,110,94,.1);border-color:var(--seal)}
.fb.ng{background:rgba(174,59,51,.08);border-color:var(--hanko)}
.fb.sk{background:rgba(184,123,42,.1);border-color:var(--wakaranai)}
.fb-h{font-family:'Shippori Mincho',serif;font-size:20px;font-weight:700}
.fb.ok .fb-h{color:var(--seal)}.fb.ng .fb-h{color:var(--hanko)}.fb.sk .fb-h{color:var(--wakaranai)}
.fb-ans{font-size:13px;margin:2px 0 8px}
.fb-ex{font-size:14.5px;line-height:1.8}
.fb-fact{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13.5px;line-height:1.75;white-space:pre-wrap}
.fb-fact b{display:block;font-size:11px;color:var(--ink-soft);font-weight:600}
.next{height:56px;font-size:16px}
.quit{display:block;margin:18px auto 0;background:none;border:none;color:var(--ink-soft);font-size:13px;text-decoration:underline}
/* result */
.score{text-align:center}
.score .big{font-family:'Shippori Mincho',serif;font-size:44px;font-weight:700;line-height:1.2}
.score .rate{color:var(--ink-soft);font-size:13px}
.rlist{list-style:none;margin:0;padding:0}
.rlist li{padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px;line-height:1.7;white-space:pre-wrap}
.rlist li:last-child{border-bottom:none}
.mk{font-weight:700;margin-right:6px}
.mk.o{color:var(--seal)}.mk.x{color:var(--hanko)}
.empty{text-align:center;padding:30px 16px}
.empty p{margin:0 0 6px}
/* modal */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(34,42,61,.45);display:flex;align-items:flex-end;justify-content:center}
.mode-desktop .overlay{align-items:center;padding:20px}
.modal{background:var(--paper);width:100%;max-width:640px;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.mode-desktop .modal{border-radius:18px;padding:22px}
.modal h3{font-family:'Shippori Mincho',serif;font-size:19px;margin:0 0 12px}
.handle{width:40px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 12px}
.mode-desktop .handle{display:none}
.fl{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin:12px 0 4px}
.inp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;font-size:16px;line-height:1.6}
textarea.inp{resize:vertical}
#ed-qs{counter-reset:q}
.ed-q{background:var(--paper-deep);border-radius:12px;padding:10px;margin-top:10px;counter-increment:q}
.ed-q-head{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.ed-q-head .n{font-weight:700;font-size:13px;flex:1}
.ed-q-head .n::after{content:counter(q)}
.ed-q .inp{margin-top:6px}
.ed-q select.inp{width:auto;margin-top:0;padding:5px 8px;font-size:15px}
.small-btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600}
.foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center;margin-top:16px}
.foot .spacer{flex:1}
.note{font-size:12.5px;color:var(--ink-soft);line-height:1.7;margin:6px 0}
.warn{font-size:12.5px;color:var(--hanko);margin:6px 0;white-space:pre-wrap}
.menu-sec{margin-bottom:14px}
.menu-h{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
.menu-btn{position:relative;display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;margin-bottom:6px;cursor:pointer;line-height:1.5}
.menu-btn.danger{color:var(--hanko)}
.menu-note{font-size:11.5px;color:var(--ink-soft)}
.menu-note.alert{color:var(--hanko)}
.preview{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px}
.preview ul{margin:6px 0 0;padding-left:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));z-index:60;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:13px;max-width:90vw;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.mode-mobile .toast{bottom:calc(86px + env(safe-area-inset-bottom))}
@media (hover:hover){.btn:hover:not(:disabled),.menu-btn:hover{border-color:var(--gold)}}

.star-btn{flex:none;border:1.5px solid #c8a200;background:var(--card);color:#a88600;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;line-height:1.3;white-space:nowrap}
.star-btn.on{background:#ffd84a;border-color:#b8920a;color:#5a4600}
.item-actions .star-btn{padding:5px 11px}
.q-star{margin-left:auto;font-size:15px;padding:3px 11px}
.fb-star{margin-top:12px;text-align:center}
.fb-star .star-btn{padding:6px 16px}
.star-start{text-align:left;border-color:#c8a200;background:#fffbe6;color:#6e5300}
.star-start small{color:#8a7430}
.chip[data-f=star]{color:#a88600}
.chip[data-f=star].active{background:#ffd84a;color:#5a4600;border-color:#b8920a}

</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-seal">外</span><span class="brand-name">外務員暗記道場</span></div>
  <button class="mode-btn" id="modeBtn" data-act="toggle-mode"></button>
</header>
<div class="layout">
  <aside class="sidebar"><div id="sideMods"></div><div class="side-menu" id="sideMenu"></div></aside>
  <main id="main"></main>
</div>
<nav class="bottomnav" id="bnMods"></nav>
<div class="overlay hidden" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast hidden" id="toast"></div>
<script>
/* ===== 組み込みデータ =====
 章ごとに、各項目は [ 項目文（＝○の問題）, ×の問題, 解説 ]。
 項目IDは「章コード-章内の番号」で決まるため、並び順を変えないこと。追加は各章の末尾に。 */
const DATA = [
{ch:"CH1", title:"証券市場の基礎知識", color:"#8A6D3B", facts:[
  ["日本証券金融は、金融商品取引業者に対する金銭の貸付けと、金融商品取引業者の顧客に対する金銭の貸付けをどちらも業務として行っている。","日本証券金融が行う金銭の貸付けは金融商品取引業者に対するものに限られ、その顧客に対する貸付けは行わない。","日証金は貸借取引のほか、一般貸付として業者やその顧客（個人など）への貸付けも行う。"],
  ["日本証券金融は、内閣総理大臣の免許を受けた証券金融専門の株式会社である。","日本証券金融は、内閣総理大臣の登録を受けた証券金融専門の株式会社である。","証券金融会社は「登録」ではなく「免許」制。"],
  ["投資者保護基金の補償限度額は、対象顧客1人当たり1,000万円である。","投資者保護基金の補償限度額は、対象顧客1人当たり3,000万円である。","補償限度額は顧客1人当たり1,000万円。"],
  ["サステナビリティ・リンク・ボンドは、資金使途を限定せず、発行体が設定したKPIとその目標（SPT）の達成状況に応じて、利払いや償還などの条件が変わる債券である。","サステナビリティ・リンク・ボンドは、調達資金の使途を環境・社会に貢献する事業に限定した債券である。","資金使途を限定しないのが特徴。使途を限定するのはグリーンボンドなど。"]
]},
{ch:"CH2", title:"金融商品取引法", color:"#AE3B33", facts:[
  ["信託の受益権、合同会社の社員権、集団投資スキーム持分などは、みなし有価証券（第二項有価証券）に分類される。","信託の受益権や集団投資スキーム持分は、第一項有価証券に分類される。","証券が発行されない権利は、みなし有価証券（第二項有価証券）として扱われる。"],
  ["有価証券の募集とは、第一項有価証券では50名以上を相手方として取得勧誘を行う場合、第二項有価証券では500名以上が所有することとなる場合をいう。","有価証券の募集とは、第一項有価証券では500名以上、第二項有価証券では50名以上を相手方とする場合をいう。","第一項有価証券は「50名以上」、第二項有価証券は「500名以上が所有」。"],
  ["有価証券の私募の取扱いは、銀行や保険会社などの登録金融機関も行うことができる。","有価証券の私募の取扱いは、第一種金融商品取引業者しか行うことができない。","登録金融機関も私募の取扱いを行える。"],
  ["金融商品取引業者が付随業務（有価証券の貸借、信用取引に付随する金銭の貸付け、保護預りなど）を行う場合、内閣総理大臣への届出や承認は不要である。","金融商品取引業者が付随業務を行うには、あらかじめ内閣総理大臣の承認を受けなければならない。","付随業務は届出・承認とも不要。届出業務は届出、承認業務は承認が必要。"],
  ["第一種金融商品取引業のうち、上場株券等を扱うPTS（私設取引システム）の運営業務を行うには、内閣総理大臣の認可が必要である。","PTSの運営業務は、第一種金融商品取引業の登録を受けていれば、別途の手続なく行うことができる。","PTS運営業務は登録に加えて「認可」が必要。"],
  ["金融商品取引業者の登録申請書の記載事項に変更があったときは2週間以内に、添付書類の記載事項に変更があったときは遅滞なく、内閣総理大臣に届け出なければならない。","金融商品取引業者の登録申請書の記載事項に変更があったときは、30日以内に届け出ればよい。","登録申請書は「2週間以内」、添付書類は「遅滞なく」。"],
  ["第一種金融商品取引業者は、自己資本規制比率が120％を下回らないようにしなければならない。","第一種金融商品取引業者は、自己資本規制比率が100％を下回らないようにしなければならない。","基準は120％。"],
  ["内閣総理大臣は、外務員が欠格事由に該当したときや、法令に違反するなど職務に関して著しく不適当な行為をしたときなどは、登録の取消し又は2年以内の職務停止を命ずることができる。","内閣総理大臣は、外務員が法令に違反したときは、6か月以内の職務停止を命ずることができる。","外務員の職務停止は「2年以内」。"],
  ["金融商品取引業者等は、登録外務員の氏名や役員・使用人の別に変更があったとき、欠格事由に該当したとき、退職などで職務を行わなくなったときは、遅滞なく内閣総理大臣に届け出なければならない。","登録外務員が退職したときは、30日以内に内閣総理大臣に届け出ればよい。","変更・欠格・退職などは「遅滞なく」届出。"],
  ["外務員は、複数の金融商品取引業者等や金融商品仲介業者で、同時に外務員の登録を受けることはできない。","外務員は、所属先の承認があれば、複数の金融商品取引業者で同時に外務員登録を受けることができる。","他の業者等に登録されている者は、重ねて登録を受けられない。"],
  ["金融商品取引業者等は、勧誘の要請をしていない個人顧客に対し、訪問や電話によって店頭デリバティブ取引の契約締結を勧誘してはならない（不招請勧誘の禁止）。","不招請勧誘の禁止は、上場株券や投資信託の売買の勧誘にも適用される。","不招請勧誘の禁止は店頭デリバティブ取引等が対象。上場株券や投資信託の取引は対象外。"],
  ["上場株券や投資信託の取引には、クーリング・オフ（書面による解除）の制度はない。","上場株券の売買には、契約締結時交付書面を受け取った日から10日間のクーリング・オフが認められている。","金商法のクーリング・オフは投資顧問契約が対象。"],
  ["顧客が特定投資家である場合、広告等の規制、不招請勧誘の禁止、再勧誘の禁止、適合性の原則は適用されない。","顧客が特定投資家である場合でも、適合性の原則は適用される。","特定投資家は知識・経験が十分とされ、これらの規制は適用除外。"],
  ["顧客が特定投資家である場合、取引態様の事前明示義務、契約締結前の書面交付、書面による解除（クーリング・オフ）、最良執行方針等記載書面の交付、顧客の有価証券を担保に供する行為の制限も適用されない。","顧客が特定投資家であっても、取引態様の事前明示義務は適用される。","これらも特定投資家には適用除外。"],
  ["信用格付業を行う法人は、内閣総理大臣の登録を受けることができる（登録は義務ではない）。","信用格付業を行う法人は、必ず内閣総理大臣の登録を受けなければならない。","登録は任意。"],
  ["無登録業者が付与した格付を、無登録である旨や登録の意義等を告げずに提供して勧誘することは禁止されている。格付の提供そのものが禁止されているわけではない。","無登録業者が付与した格付を提供して勧誘することは、説明の有無にかかわらず一切禁止されている。","所定の事項を告げれば提供できる。"],
  ["店頭デリバティブ取引は、投資者保護基金の補償の対象外である。","店頭デリバティブ取引に係る顧客資産は、投資者保護基金の補償の対象となる。","店頭デリバティブ取引は補償の対象外。"],
  ["投資者保護基金は、破綻した金融商品取引業者に代わって一般顧客に補償金を支払うほか、顧客資産の返還のために破綻業者へ資金の貸付けを行うこともある。","投資者保護基金の業務は一般顧客への補償金の支払いに限られ、破綻業者への資金の貸付けは行わない。","返還資金の貸付けも業務に含まれる。"],
  ["インサイダー取引規制の重要事実の「公表」とは、2以上の報道機関に公開して12時間以上経過したこと、金融商品取引所に通知し公衆の縦覧に供されたこと、重要事実を記載した有価証券報告書等が公衆の縦覧に供されたことのいずれかをいう。","重要事実を2以上の報道機関に公開した場合、24時間以上経過したときに公表されたものとされる。","報道機関ルートは「12時間」。取引所（TDnet）ルートは縦覧に供された時点で公表。"],
  ["すでに開示が行われている有価証券の売出しでは、内閣総理大臣への届出は不要だが、目論見書の交付は必要である。","すでに開示が行われている有価証券の売出しでは、届出も目論見書の交付も不要である。","届出は不要、目論見書の交付は必要。"],
  ["上場会社、店頭登録会社、募集・売出しで届出をした有価証券の発行者、資本金5億円以上かつ株主数1,000名以上の会社は、継続開示義務を負う。","資本金1億円以上かつ株主数500名以上の会社は、継続開示義務を負う。","外形基準は「資本金5億円以上・株主数1,000名以上」。"],
  ["上場会社等は半期ごとに半期報告書を提出し、記載内容が金融商品取引法令に基づき適正であることを確認した旨を記載した確認書もあわせて提出しなければならない。","上場会社等は、半期報告書を提出すれば確認書を提出する必要はない。","有価証券報告書・半期報告書には確認書が必要。"],
  ["内部統制報告書とは、企業集団とその会社の財務計算に関する書類などの適正性を確保するための体制を評価した報告書で、上場会社等は有価証券報告書とあわせて毎事業年度提出する。","内部統制報告書は、半期報告書とあわせて半期ごとに提出する。","有価証券報告書とあわせて事業年度ごとに提出。"],
  ["有価証券届出書、発行登録書、有価証券報告書、半期報告書、確認書、内部統制報告書、臨時報告書、自己株券買付状況報告書などは、公衆の縦覧に供される。","臨時報告書は、公衆の縦覧に供されない。","これらの開示書類はいずれも公衆縦覧の対象。"],
  ["有価証券報告書、半期報告書、臨時報告書、有価証券届出書、大量保有報告書などの提出手続は、EDINET（電子開示システム）を使用して行わなければならない。","有価証券報告書の提出は、TDnetを使用して行わなければならない。","法定開示はEDINET。TDnetは取引所の適時開示。"],
  ["株券等保有割合が5％を超えることとなった者は、その日から5日以内に大量保有報告書を内閣総理大臣に提出しなければならない（5％ルール）。","株券等保有割合が3％を超えることとなった者は、大量保有報告書を提出しなければならない。","基準は5％超、提出期限は5日以内。"],
  ["大量保有報告書の提出後、株券等保有割合が1％以上増減した場合は、その日から5日以内に変更報告書を提出しなければならない。","大量保有報告書の提出後は、株券等保有割合が5％以上増減した場合に限り変更報告書を提出する。","1％以上の増減で変更報告書。"],
  ["内閣総理大臣に提出された大量保有報告書や変更報告書は、原則として5年間公衆の縦覧に供される。","大量保有報告書は、原則として1年間公衆の縦覧に供される。","縦覧期間は5年間。"],
  ["株券、新株予約権付社債券、新株予約権証券、株券の性質を有する外国の者の証券、投資証券等は、大量保有報告制度の対象となる有価証券である。","新株予約権付社債券は、大量保有報告制度の対象とならない。","潜在株式も含めて対象。"],
  ["勧誘受諾意思確認義務（勧誘前に勧誘を受ける意思を確認する義務）の対象に、証券投資信託に係る取引は含まれない。","証券投資信託の取得を勧誘する際は、勧誘前に顧客の勧誘受諾意思を確認しなければならない。","対象は店頭デリバティブ取引や商品関連市場デリバティブ取引など。投資信託は対象外。"],
  ["最良執行方針等に従って注文を執行した旨の説明書面の交付は、一定期間内に顧客から求められたときに行う。","顧客の注文を執行するたびに、最良執行方針等に従って執行した旨の説明書面を必ず交付しなければならない。","顧客から求めがあったときに行う。"],
  ["特定かつ少数の銘柄を、不特定かつ多数の顧客に対し、一定期間継続して一斉にかつ過度に勧誘し、公正な価格形成を損なうおそれがある行為は禁止されている。","不特定かつ多数の銘柄を、特定かつ少数の顧客に対し、継続して一斉に勧誘する行為は、大量推奨販売として禁止されている。","「特定かつ少数の銘柄」を「不特定かつ多数の顧客」に、が正しい組合せ。"],
  ["金融商品取引業者等は、顧客から売買注文を受けたときは、あらかじめ自己が相手方となるのか、媒介・取次ぎ・代理によるのかの別を明らかにしなければならない。明示の方法は自由で、口頭でもよい。","取引態様の事前明示は、必ず書面で行わなければならない。","明示の方法に定めはない。"],
  ["顧客の有価証券を担保に供したり他人に貸し付けたりする場合は、顧客から書面（電磁的方法を含む）による同意を得なければならない。","顧客の有価証券を担保に供する場合は、口頭の同意を得れば足りる。","書面による同意が必要。"],
  ["金融商品取引業者等は、有価証券等管理業務として行う場合などを除き、投資一任契約に関して顧客から金銭や有価証券の預託を受けてはならない。","投資一任契約を結んだ顧客からは、運用のために金銭の預託を自由に受けることができる。","投資一任契約に関する預託の受入れは原則禁止。"],
  ["取引状況について他人に誤解を生じさせる目的で、自己の売付け（買付け）と同時期・同価格で他人が買付け（売付け）を行うことをあらかじめ通謀して行う取引を、馴合取引（馴合売買）という。","権利の移転を目的としない見せかけの取引を、馴合取引という。","通謀するのが馴合取引。権利移転を目的としない見せかけの取引は仮装取引。"],
  ["権利の移転や金銭の授受を目的としない見せかけの取引を、仮装取引（仮装売買）という。","他人と通謀して同時期・同価格で売買を行うことを、仮装取引という。","通謀して行うのは馴合取引。"],
  ["空売り（有価証券を有しないで行う売付け）は、政令で定める規制（空売りであることの明示・確認、価格規制など）に従わなければ行うことができない。","空売りは、どのような場合でも全面的に禁止されている。","規制に従えば行える。信用取引の売付けも空売りにあたる。"],
  ["会社関係者は、会社関係者でなくなってから1年以内は、引き続きインサイダー取引規制の対象となる。","会社関係者は、会社関係者でなくなった時点でインサイダー取引規制の対象から外れる。","元会社関係者も1年間は規制の対象。"],
  ["株式無償割当て、合併、資本金の額の減少、株式の分割、主要株主の異動は、いずれもインサイダー取引規制上の重要事実に該当する。","主要株主の異動は、インサイダー取引規制上の重要事実に該当しない。","主要株主の異動は「発生事実」として重要事実に該当する。"],
  ["インサイダー取引規制における主要株主とは、総株主等の議決権の100分の10以上を保有している株主をいう。","インサイダー取引規制における主要株主とは、総株主等の議決権の100分の5以上を保有している株主をいう。","主要株主は10％以上。5％は大量保有報告の基準。"],
  ["上場会社等の役員や主要株主が、自社の特定有価証券等を買付けた後6か月以内に売付けて利益を得たときは、その会社は利益の提供を請求できる。","上場会社等の役員が自社株を買付けた後1年以内に売付けて利益を得たときは、会社は利益の提供を請求できる。","短期売買利益の返還請求は「6か月以内」。"],
  ["取引所金融商品市場によらないで、取引所の相場により差金の授受を目的とする行為は禁止されているが、金融商品取引業者等が当事者となる一定の店頭デリバティブ取引などは適用除外とされている。","取引所金融商品市場によらないで、取引所の相場により差金の授受を目的とする行為は、例外なくすべて禁止されている。","登録業者による店頭デリバティブ取引（CFDなど）は適用除外。"],
  ["国債証券、地方債証券、金融債、政府保証債、流動性の低い一定の集団投資スキーム持分などは、企業内容等開示制度の適用除外とされている。","国債証券は、企業内容等開示制度の対象となる。","公共性の高い債券などは開示制度の適用除外。"],
  ["有価証券の募集又は売出しの届出は、その有価証券の発行者が行う。","有価証券の募集又は売出しの届出は、引受けを行う金融商品取引業者が行う。","届出義務者は発行者。"],
  ["有価証券の募集又は売出し等のために使用される、発行者の事業内容等を説明する文書を目論見書という。","有価証券の募集又は売出しのために投資家に交付する、発行者の事業内容等を説明する文書を、有価証券届出書という。","投資家に交付するのが目論見書。届出書は内閣総理大臣に提出する書類。"],
  ["適格機関投資家に取得させる場合や、同一銘柄をすでに所有する者（同居者が交付を受けた場合を含む）が交付を受けないことに同意した場合は、目論見書の交付は不要である。","適格機関投資家に有価証券を取得させる場合でも、目論見書の交付は必ず必要である。","適格機関投資家や一定の同意がある場合は交付不要。"]
]},
{ch:"CH3", title:"金融商品の勧誘・販売に関係する法律", color:"#C0623B", facts:[
  ["消費者契約法による取消権は、追認できる時から1年間（霊感等による場合は3年間）行使しないとき、又は契約締結時から5年（霊感等による場合は10年）を経過したときに消滅する。","消費者契約法による取消権は、追認できる時から5年間行使しないときに消滅する。","原則「1年／5年」、霊感等は「3年／10年」。"],
  ["消費者契約法の「消費者」とは個人をいい、事業として又は事業のために契約の当事者となる個人は含まれない。","事業のために契約の当事者となる個人も、消費者契約法の「消費者」に含まれる。","事業のための契約当事者は消費者に該当しない。"],
  ["取引時確認を行ったときは、確認記録を直ちに作成し、取引終了日と取引時確認日のうち後に到来する日から7年間保存しなければならない。","取引時確認の記録は、取引終了日から5年間保存すればよい。","保存期間は7年間。"],
  ["個人データの取扱いを、利用目的の達成に必要な範囲内で委託する場合、委託先は第三者に該当しないため、本人の同意は不要である。","個人データの取扱いを委託する場合でも、委託先は第三者にあたるため本人の同意が必要である。","委託は第三者提供にあたらない。"]
]},
{ch:"CH4", title:"経済・金融・財政の常識", color:"#4A6A9C", facts:[
  ["景気動向指数は内閣府が毎月公表し、日銀短観（全国企業短期経済観測調査）は日本銀行が3か月に1回公表する。","日銀短観は、日本銀行が毎月公表している。","景気動向指数＝内閣府・毎月、短観＝日銀・四半期ごと。"],
  ["企業物価指数（CGPI）は、日本銀行が公表している。","企業物価指数（CGPI）は、総務省が公表している。","CGPIとSPPIは日銀、CPIは総務省。"],
  ["消費者物価指数（CPI）は総務省が公表しており、直接税や社会保険料などの非消費支出や、土地・住宅の価格は含まれない。","消費者物価指数（CPI）には、土地や住宅の価格が含まれる。","CPIは消費支出が対象。"],
  ["企業向けサービス価格指数（SPPI）は、日本銀行が公表している。","企業向けサービス価格指数（SPPI）は、内閣府が公表している。","SPPIは日銀。"],
  ["GDPデフレーターはCPIよりも包括的な物価指数で、CPIは輸入品の価格を含むが、GDPデフレーターは国内生産分のみを対象とし輸入品を含まない。","GDPデフレーターは輸入品の価格を含むが、CPIは含まない。","輸入品を含むのはCPI。"],
  ["国際収支統計は、経常収支、資本移転等収支、金融収支から構成される（ほかに誤差脱漏）。","国際収支統計は、経常収支と貿易収支の2つで構成される。","3つの収支で構成。貿易収支は経常収支の内訳。"],
  ["貿易依存度は、輸出額や輸入額を名目GDPで割って求める。","貿易依存度は、輸出額や輸入額を実質GDPで割って求める。","分母は名目GDP。"],
  ["基準割引率及び基準貸付利率とは、日本銀行が民間金融機関に貸出を行う際に適用される基準金利である。","基準割引率及び基準貸付利率とは、民間金融機関が企業に貸出を行う際の最優遇金利である。","日銀から民間金融機関への貸出の基準金利。"],
  ["日本銀行の公開市場操作の対象には国庫短期証券が含まれるが、株式は含まれない。","日本銀行の公開市場操作では、個別企業の株式を売買の対象としている。","公開市場操作は国債・国庫短期証券などが対象。"],
  ["予算は衆議院が先に審議し、参議院が衆議院の可決した予算を受け取ってから30日以内に議決しないときは、衆議院の議決が国会の議決となる（自然成立）。","予算は参議院が先に審議し、衆議院が30日以内に議決しないときは自然成立する。","予算は衆議院が先議、30日で自然成立。"],
  ["国民負担率は、租税負担と社会保障負担の合計を国民所得で割って求める。","国民負担率は、租税負担と社会保障負担の合計を名目GDPで割って求める。","分母は国民所得。"],
  ["一般会計の歳出から国債費の一部を除いたものを、基礎的財政収支対象経費という。","一般会計の歳出から社会保障関係費を除いたものを、基礎的財政収支対象経費という。","除くのは国債費（の一部）。"],
  ["一般歳出の主要経費は、社会保障関係費、防衛関係費、公共事業関係費、文教及び科学振興費の順に多い。","一般歳出のうち最も多いのは公共事業関係費である。","最大は社会保障関係費。"],
  ["一般会計の税収は、消費税、所得税、法人税の順に多い。","一般会計の税収で最も多いのは所得税である。","最大は消費税。"],
  ["プライマリーバランス（基礎的財政収支）とは、借入れ（公債金）以外の収入と、利払い費及び債務償還費を除いた支出との収支をいう。","プライマリーバランスとは、税収と、利払い費を含むすべての歳出との収支をいう。","借金関係（公債金・国債費）を除いて比べる。"],
  ["GDPの三面等価の原則の3つの側面とは、生産、分配、支出である。","GDPの三面等価の原則の3つの側面とは、生産、消費、投資である。","生産・分配・支出。"],
  ["有効求人倍率は、有効求人数を有効求職者数で割って求める。","有効求人倍率は、有効求職者数を有効求人数で割って求める。","求人数÷求職者数。"],
  ["マネーストック統計で、M1は現金通貨と預金通貨、M3はM1に準通貨とCD（譲渡性預金）を加えたものである。","M3は、M1に国債を加えたものである。","M3＝M1＋準通貨＋CD。"],
  ["M2の対象となる預金の預入先はゆうちょ銀行などを除く国内銀行等に限られ、M3の預入先にはゆうちょ銀行、農協、信用組合、労働金庫なども含まれる。","M2の預入先にはゆうちょ銀行が含まれるが、M3には含まれない。","ゆうちょ銀行などが入るのはM3（M2には入らない）。"]
]},
{ch:"CH5", title:"セールス業務", color:"#6C8A4E", facts:[
  ["事務ミスが発生したときは、まず内部管理責任者に報告し、その指示に従って顧客に対応する。事実の隠蔽や、担当者限りで顧客に追認を求めることは禁止されている。","事務ミスが発生したときは、まず担当者が顧客に事情を説明して追認を得てから、上司に報告する。","報告が先。担当者限りの処理は不可。"],
  ["外貨建債券を勧誘する際は、為替手数料などのコストにより利回りが目減りする可能性があることを説明しなければならない。","外貨建債券は利回りが高いため、為替手数料などのコストについて説明する必要はない。","コストによる目減りの説明が必要。"],
  ["IOSCO（証券監督者国際機構）の行為規範原則は、誠実・公正、注意義務、能力、顧客に関する情報、顧客に対する情報開示、利益相反、コンプライアンスの7項目である。","IOSCOの行為規範原則に「利益相反」は含まれない。","7原則に利益相反も含まれる。"],
  ["業者は、顧客の最大の利益及び市場の健全性を図るため、その業務に適用されるすべての規則を遵守しなければならない（IOSCOのコンプライアンス原則）。","業者は、顧客の最大の利益を図るためであれば、業務に適用される規則の一部を遵守しなくてもよい。","すべての規則を遵守する。"]
]},
{ch:"CH6", title:"協会定款・諸規則", color:"#3F6E5E", facts:[
  ["協会員は、顧客（特定投資家を除く）について顧客カードを備え付け、氏名、住所、生年月日、職業のほか、投資目的、資産の状況、投資経験の有無、取引の種類などを記載しなければならない。","顧客カードには、顧客の主要取引先を記載しなければならない。","主要取引先は記載事項ではない。"],
  ["信用取引などの取引開始基準は、日本証券業協会ではなく、各協会員が定める。","信用取引などの取引開始基準は、日本証券業協会が一律に定めている。","基準を定めるのは各協会員。"],
  ["商品関連市場デリバティブ取引の取次ぎ等の契約を特定投資家以外の顧客と締結する際は注意喚起文書を交付しなければならないが、契約締結前1年以内に交付している場合などは改めて交付する必要はない。","商品関連市場デリバティブ取引の取次ぎ等の契約を締結する際は、その都度必ず注意喚起文書を交付しなければならない。","1年以内に交付済みなら不要。"],
  ["新株予約権証券、有価証券関連デリバティブ取引、店頭デリバティブ取引、これらに類する複雑な仕組債・投資信託の契約を締結するときは、顧客から確認書を徴求しなければならない。","複雑な仕組債の販売では、口頭で説明すれば確認書を徴求する必要はない。","リスク等を理解した旨の確認書が必要。"],
  ["取引所等が委託保証金率の引上げ措置を行っている銘柄の信用取引を受託する場合は、原則としてその措置が行われていることや内容を顧客に説明しなければならない。","委託保証金率の引上げ措置が行われている銘柄の信用取引は、受託すること自体が禁止されている。","受託は可能。措置内容の説明が必要。"],
  ["証券金融会社が貸株利用等に関する注意喚起通知を行った銘柄の信用取引を受託する場合は、原則としてその措置や内容を顧客に説明しなければならない。","証券金融会社の注意喚起通知は業者向けのものなので、顧客に説明する必要はない。","顧客への説明が必要。"],
  ["有価証券オプション取引の制限又は禁止措置が行われている場合は、勧誘を自粛するとともに、受託の際に措置の内容を説明しなければならない。","有価証券オプション取引の制限措置が行われている場合でも、受託の際に説明すれば勧誘を自粛する必要はない。","制限・禁止措置なら、勧誘の自粛と説明の両方。"],
  ["有価証券オプション取引の建玉に関して注意喚起が行われている場合は、受託の際に措置の内容を説明すればよく、勧誘の自粛までは求められない。","有価証券オプション取引の建玉に関する注意喚起が行われている場合は、勧誘を自粛しなければならない。","注意喚起なら説明のみ。"],
  ["照合通知書は、有価証券の売買等を行う顧客には1年に1回以上、デリバティブ取引等を行う顧客には1年に2回以上交付する。取引残高報告書を定期的に交付し、その中に報告内容が記載されている場合は不要である。","照合通知書は、デリバティブ取引を行う顧客に対しても1年に1回交付すれば足りる。","取引の種類で頻度が異なる。"],
  ["残高がない顧客でも、直前の報告以後1年間に残高があったものについては、照合通知書により報告しなければならない。","照合通知書は、報告時点で残高がある顧客にのみ交付すればよい。","過去1年に残高があれば報告の対象。"],
  ["照合通知書は、協会員の検査、監査又は管理を担当する部門で作成し、郵送で交付することが原則である。","照合通知書は、顧客を担当する営業部門で作成し、担当外務員が手渡しすることが原則である。","営業部門から独立した部門が作成し郵送。"],
  ["照合通知書の交付頻度は、取引の種類や頻度に応じた顧客の区分ごとに定められており、残高に異動があるたびに交付するものではない。","照合通知書は、顧客の債権債務の残高に異動があるたびに交付しなければならない。","顧客の区分ごとの定期交付。"],
  ["契約締結時等交付書面も、郵送により交付することが原則である。","契約締結時等交付書面は、担当外務員が直接手渡しすることが原則である。","郵送が原則。"],
  ["日本証券業協会は事故を起こした者を不都合行為者として処分し、一級不都合行為者は無期限、二級不都合行為者は5年以内の期間、協会員による採用が禁止される。","二級不都合行為者は、無期限に協会員による採用が禁止される。","一級＝無期限、二級＝5年以内。"],
  ["二種外務員は、信用取引、有価証券関連デリバティブ取引、新株予約権証券、カバードワラント、選択権付債券売買取引、店頭デリバティブ取引に類する複雑な仕組債・投資信託、レバレッジ投資信託を扱うことができない。","二種外務員は、信用取引の勧誘を単独で行うことができる。","これらは一種外務員の範囲。"],
  ["二種外務員は、新株予約権付社債は扱えるが、新株予約権証券は扱えない。","二種外務員は、新株予約権証券を扱うことができる。","付社債はOK、新株予約権証券はNG。"],
  ["一種外務員又は信用取引外務員の同行がある場合に二種外務員が行えるのは、信用取引及び発行日取引に係る外務員の職務のみである。","一種外務員の同行があれば、二種外務員は有価証券関連デリバティブ取引に係る職務も行うことができる。","同行で可能なのは信用取引・発行日取引のみ。"],
  ["日本証券業協会は、外務員が欠格事由に該当したとき、法令違反をしたとき、外務員として著しく不適当な行為をしたときは、2年以内の期間を定めて職務の停止を命じることができる。","日本証券業協会は、外務員が法令に違反したときは、5年以内の期間を定めて職務の停止を命じることができる。","職務停止は2年以内。"],
  ["協会員は、登録外務員に、外務員登録日から5年ごとの日の属する月の初日から1年以内に外務員資格更新研修を修了させなければならず、修了しなかった者はすべての外務員資格の効力が停止される。","外務員資格更新研修は、外務員登録日から3年ごとに受講しなければならない。","5年ごと・1年以内。未修了だと資格の効力停止。"],
  ["外務員の資質向上のための社内研修は、毎年行うものとされている。","外務員の資質向上のための社内研修は、5年ごとに行うものとされている。","毎年行う。"],
  ["外国証券の取引に関する規則は、デリバティブ取引や、国内の金融商品取引所に上場されている外国証券の取引などには適用されない。","外国証券の取引に関する規則は、国内の金融商品取引所に上場されている外国証券の取引にも全面的に適用される。","適用されない取引がある点に注意。"],
  ["勧誘開始基準は、特定投資家を除く個人顧客のみが対象とされている。","勧誘開始基準は、法人顧客も含むすべての顧客が対象とされている。","対象は個人顧客（特定投資家を除く）。"],
  ["勧誘開始基準でいう「販売の勧誘」とは、要請をしていない顧客への訪問・電話による勧誘と、本店その他の営業所等での勧誘に限られる。","勧誘開始基準でいう「販売の勧誘」には、新聞広告による勧誘も含まれる。","訪問・電話・店頭での勧誘に限られる。"],
  ["協会員は、新規顧客や大口取引顧客などから注文を受ける際は、あらかじめ買付代金や売付有価証券の全部又は一部の預託を受けるなど、取引の安全性の確保に努める。必ず預託を受けなければならないわけではない。","協会員は、新規顧客から注文を受ける際は、必ず買付代金の全額の預託を受けなければならない。","「努める」であり義務ではない。"],
  ["顧客の注文に係る取引の適正な管理に資するための規則は、各協会員が定める社内規則である。","顧客の注文に係る取引の適正な管理に資するための規則は、日本証券業協会が定める統一規則である。","社内規則で定める。"],
  ["顧客の資金や有価証券の借入れにつき行う保証やあっせんなどの便宜の供与は、過度にならないようにしなければならないが、禁止されているわけではない。","顧客の資金の借入れについて保証やあっせんを行うことは、一切禁止されている。","過度でなければ可。"],
  ["協会員が顧客から有価証券の寄託を受けられるのは、単純な寄託契約、混合寄託契約、消費寄託契約、委任契約による場合や、質権者である場合などである。","協会員は、混合寄託契約によって顧客から有価証券の寄託を受けることはできない。","混合寄託契約も含まれる。"],
  ["累積投資契約に基づいて有価証券の寄託を受ける場合は、顧客と保護預り契約を締結する必要はない。","累積投資契約に基づいて有価証券の寄託を受ける場合でも、別途保護預り契約を締結しなければならない。","累積投資契約による寄託なら不要。"],
  ["顧客から消費寄託契約により有価証券の寄託を受ける場合は、契約書を2通作成し、1通を顧客に交付し、もう1通を保存しなければならない。","消費寄託契約により有価証券の寄託を受ける場合は、契約書を1通作成して協会員が保存すれば足りる。","2通作成して1通を交付。"],
  ["協会員の従業員は、原則として、信用取引、有価証券関連デリバティブ取引、特定店頭デリバティブ取引、商品関連市場デリバティブ取引を行ってはならない。","協会員の従業員は、自己の計算であれば信用取引を自由に行うことができる。","従業員による投機的な取引は原則禁止。"],
  ["協会員の従業員は、顧客から注文を受けた場合、自己がその相手方となって売買を成立させてはならない。","協会員の従業員は、顧客の注文に対して自己が相手方となって売買を成立させることができる。","従業員が自ら相手方になることは禁止。"],
  ["従業員の上場会社等の特定有価証券等の売買について協会員が定める社内規則には、従業員の範囲と売買等の手続に関する事項を規定する。投資勧誘の方法に関する事項は含まれない。","従業員の特定有価証券等の売買に関する社内規則には、投資勧誘の方法に関する事項を規定しなければならない。","従業員の不正取引を防ぐ規則なので、勧誘方法は含まない。"],
  ["新規公開株の個人顧客への配分では、原則として、個人顧客への配分予定数量の10％以上を抽選により配分先を決めなければならない。","新規公開株の個人顧客への配分では、配分予定数量の50％以上を抽選で決めなければならない。","10％以上を抽選。"],
  ["すでに外国証券取引口座に関する約款を交付している場合、顧客（特定投資家を除く）から改めて交付の申出がなければ、約款を交付する必要はない。","外国証券の取引のたびに、外国証券取引口座に関する約款を交付しなければならない。","交付済みなら、申出がない限り不要。"],
  ["新たに販売する有価証券等について、適合する顧客が想定できないものは、顧客に十分な説明をしたとしても販売してはならない。","適合する顧客が想定できない有価証券でも、顧客に十分な説明を行えば販売することができる。","説明しても販売不可（合理的根拠適合性）。"]
]},
{ch:"CH7", title:"取引所定款・諸規則", color:"#2E6F7E", facts:[
  ["大阪取引所の取引参加者は、扱う取引の種類ごとに区分されている（先物・オプション取引参加者、国債先物等取引参加者など）。","大阪取引所の取引参加者の資格は1種類で、扱う取引による区分はない。","取引の種類ごとに参加者資格が分かれる。"],
  ["大阪取引所の国債先物等取引参加者になれるのは、第一種金融商品取引業者のうち金融商品取引法第28条第1項第1号の業務の登録を受けた者などである。","大阪取引所の国債先物等取引参加者には、第二種金融商品取引業者もなることができる。","第一種業者などが対象。"],
  ["取引参加者は、事故防止などの観点から、顧客の調査を行うことが義務付けられている。","取引参加者による顧客の調査は任意とされている。","顧客の調査は義務。"],
  ["プライム市場は、多くの機関投資家の投資対象となりうる規模の時価総額（流動性）と、より高いガバナンス水準を備え、投資家との建設的な対話を中心に据える企業向けの市場である。","プライム市場は、高い成長可能性を持つ一方で、事業実績の観点から相対的にリスクが高い企業向けの市場である。","後者はグロース市場の説明。"],
  ["スタンダード市場は、一定の時価総額（流動性）と、上場企業としての基本的なガバナンス水準を備えた企業向けの市場である。","スタンダード市場は、多くの機関投資家の投資対象となりうる規模の時価総額と、より高いガバナンス水準を備えた企業向けの市場である。","後者はプライム市場の説明。"],
  ["グロース市場は、高い成長可能性を実現するための事業計画とその進捗の適時・適切な開示が行われる一方、事業実績の観点から相対的にリスクが高い企業向けの市場である。","グロース市場は、一定の時価総額と基本的なガバナンス水準を備えた企業向けの市場である。","後者はスタンダード市場の説明。"],
  ["東証スタンダード市場の上場審査は、株主数、流通株式、事業継続年数、純資産の額などの形式要件をすべて満たすものを対象に行われる。","東証スタンダード市場の上場審査は、形式要件の一部を満たしていれば行われる。","形式要件すべてに適合することが前提。"],
  ["上場株券等の発行者が同一種類の株券等を新たに発行する場合、東証は原則としてその上場を承認し、新規上場申請は不要である。","上場株券等の発行者が同一種類の株券を新たに発行する場合は、改めて新規上場申請を行わなければならない。","原則として上場を承認。"],
  ["東証の上場株券等について他の市場区分への変更申請があった場合は、新規上場申請時と同様の審査が行われる。","東証で他の市場区分への変更を申請した場合は、審査なしで変更が承認される。","新規上場と同様の審査。"],
  ["東証における適時開示は、東証のルールに基づくもので、適時開示情報伝達システム（TDnet）を利用して行う。","東証における適時開示は、金融商品取引法に基づき、EDINETを利用して行う。","適時開示＝取引所ルール・TDnet。"],
  ["上場廃止が決定された銘柄は整理銘柄に、上場廃止基準に該当するおそれがある銘柄や上場廃止申請が行われた銘柄は管理銘柄に指定される。","上場廃止が決定された銘柄は、管理銘柄に指定される。","廃止決定＝整理銘柄、おそれ・申請＝管理銘柄。"],
  ["非参加型優先株の上場審査や上場廃止については、普通株とは異なる基準が設けられている。","非参加型優先株の上場審査は、普通株と同じ基準で行われる。","特異性を考慮した別の基準。"],
  ["発行者からの申請なしで上場できるのは、国債証券だけである。","地方債証券は、発行者からの申請なしで上場できる。","申請不要は国債証券のみ。"],
  ["転換社債型新株予約権付社債券の上場審査基準には、発行者に対する基準と、上場申請銘柄に対する基準とがある。","転換社債型新株予約権付社債券の上場審査基準は、上場申請銘柄に対する基準のみである。","発行者と銘柄の両方に基準がある。"]
]},
{ch:"CH8", title:"株式業務", color:"#7A5C99", facts:[
  ["東証の国債証券の売買の決済は、売買契約締結の日から起算して2日目の日（休業日を除く）に行われる。","東証の国債証券の売買の決済は、売買契約締結の日から起算して4日目の日に行われる。","国債は2日目。株券の普通取引は3日目。"],
  ["株券の普通取引では、配当金や権利の確定期日の前日（休業日を除く）から配当落・権利落として売買され、2日前（休業日を除く）までが権利付となる。","株券の普通取引では、権利確定期日の当日から権利落として売買される。","前日から権利落、2日前まで権利付。"],
  ["売呼値は値段の低いものが高いものに優先し、買呼値は値段の高いものが低いものに優先する（価格優先の原則）。","売呼値は、値段の高いものが低いものに優先する。","売りは安い方、買いは高い方が優先。"],
  ["成行による呼値は、指値による呼値に値段的に優先する。","指値による呼値は、成行による呼値に値段的に優先する。","成行が優先。"],
  ["板寄せ方式は始値や終値などを決定するときに用いられ、ザラバ方式は始値決定後から終値決定までの継続売買で用いられる。","ザラバ方式は、売買立会の始値を決定するときに用いられる。","始値・終値＝板寄せ、その間＝ザラバ。"],
  ["取引所の受託契約準則は、取引参加者だけでなく、その顧客も遵守しなければならない。","受託契約準則を遵守しなければならないのは取引参加者のみで、顧客には適用されない。","顧客も遵守する。"],
  ["内国株券の普通取引を委託した顧客は、原則として売買成立の日から起算して3日目の日（休業日を除く）の午前9時までに、売付有価証券又は買付代金を取引参加者に交付しなければならない。","内国株券の普通取引を委託した顧客は、売買成立の日から起算して3日目の日の正午までに買付代金を交付すればよい。","3日目の午前9時まで。"],
  ["顧客が上場株券の売買で債務不履行となった場合、取引参加者は任意に顧客の計算で売買契約を締結でき、損害を受けたときは顧客の金銭や有価証券をその賠償に充当できる。","顧客が債務不履行となった場合でも、取引参加者は顧客の同意なく顧客の計算で売買を行うことはできない。","任意の売買と、預り資産の充当ができる。"],
  ["個人投資家等（適格機関投資家以外）の信用取引による売付けのうち、1回当たりの数量が売買単位の50倍以内のものは、空売りの価格規制が適用除外とされている。","空売りの価格規制が適用除外となるのは、1回当たりの数量が売買単位の100倍以内の売付けである。","50倍以内。"],
  ["安定操作期間とは、一般に、募集・売出し等の価格決定日の翌日から申込最終日までをいう。","安定操作期間とは、一般に、募集・売出し等の発表日の翌日から払込日までをいう。","後者はファイナンス期間。"],
  ["ファイナンス期間とは、一般に、募集・売出し等（50名以上を相手方とするもの）の発表日の翌日から払込日までをいい、安定操作期間より広い期間となる。","ファイナンス期間は、安定操作期間より狭い期間である。","ファイナンス期間のほうが広い。"],
  ["顧客が株式の売買注文を委託するたびに指示すべき事項は、売買の種類、銘柄、売付け・買付けの別、数量、値段の限度、委託注文の有効期間などである。","株式の売買注文の際、委託注文の有効期間は指示する必要がない。","有効期間も指示事項。"],
  ["注文伝票は、売買が成立したかどうかにかかわらず、注文を受けた時点で作成しなければならない。","注文伝票は、売買が成立した時点で作成すればよい。","受注時に作成する。"],
  ["注文伝票には、自己又は委託の別、顧客の氏名、取引の種類、銘柄、売付け・買付けの別、数量、指値又は成行の別、受注日時、約定日時などを記載する。","注文伝票には、顧客の氏名を記載する必要はない。","顧客の氏名も記載事項。"],
  ["注文伝票は社内の記録として注文内容や日時が中心となり、契約締結時等交付書面は顧客に交付する書類として手数料や問い合わせ先などが記載される。","契約締結時等交付書面は社内記録用の書類で、顧客には交付しない。","契約締結時等交付書面は顧客に交付する。"],
  ["資金と証券の引渡しを同時又は同日中に行う決済をDVP決済といい、相手方の決済不履行による元本リスクを排除できる。","DVP決済とは、資金の決済を証券の受渡しの翌営業日に行う決済方法である。","同時（同日）の引渡しで元本リスクを排除。"],
  ["立会外バスケット取引は、15銘柄以上で構成され、かつ売買代金1億円以上のポートフォリオに限られる。","立会外バスケット取引は、10銘柄以上で構成され、売買代金5,000万円以上のポートフォリオに限られる。","15銘柄以上・1億円以上。"],
  ["PTSの売買価格の決定方法として、顧客の指値が、相手方となる他の顧客の指値と一致する場合にその指値を用いる方法が認められている。","PTSでは、顧客の指値を用いて売買価格を決定することは認められていない。","指値が一致した場合の方法が認められている。"],
  ["株式ミニ投資の取引単位は1売買単位の10分の1単位で、単元未満株のまま売買できるが、指値注文はできない。","株式ミニ投資では、指値注文を行うことができる。","価格の指示（指値）はできない。"],
  ["株式ミニ投資の約定価格は、約定日におけるあらかじめ定めた取引所の価格に基づき決まり、約定日は注文を受託した日の翌営業日である。","株式ミニ投資の約定日は、注文を受託した日の当日である。","約定日は翌営業日。"],
  ["株式ミニ投資の取扱業者が他の金融商品取引業者から株式ミニ投資の注文を受ける場合でも、株式ミニ投資に関する契約を締結しなければならない。","他の金融商品取引業者から株式ミニ投資の注文を受ける場合は、契約の締結は不要である。","契約の締結が必要。"],
  ["株式の公開価格の決定方法には、ブック・ビルディング（需要積上げ方式）と、競争入札による公募等がある。","株式の公開価格は、必ず競争入札によって決定される。","ブック・ビルディングと競争入札の2つ。"],
  ["競争入札による方式では、まず入札を行い、その落札加重平均価格等を勘案して公開価格を決定する。","投資家の需要を事前に積み上げて公開価格を決める方法を、競争入札という。","後者はブック・ビルディング。"],
  ["外国証券の取引には、国内上場の外国証券の取引（国内委託取引）、外国市場への取次ぎ（外国取引）、業者が顧客の相手方となる仕切売買（国内店頭取引）の3種類がある。","業者が顧客の相手方となって外国証券を仕切売買する取引を、外国取引という。","仕切売買は国内店頭取引。"],
  ["株式分割の理論上の権利落相場は、権利付相場を分割比率で割って求める。","株式分割の理論上の権利落相場は、権利付相場に分割比率を掛けて求める。","権利付相場÷分割比率。"],
  ["権利付で買った株式の権利落後の損益は、「権利落後の株価×分割比率－買付価格」で求める。","権利付で買った株式の権利落後の損益は、「権利落後の株価－買付価格」で求める。","分割で株数が増えた分を反映する。"],
  ["株価収益率（PER）は、株価を1株当たり当期純利益（EPS）で割って求める。","株価収益率（PER）は、株価を1株当たり純資産で割って求める。","後者はPBR。"],
  ["1株当たり当期純利益は、当期純利益を発行済株式総数で割って求める。","1株当たり当期純利益は、営業利益を発行済株式総数で割って求める。","当期純利益を使う。"],
  ["1株当たりキャッシュフローは、（当期純利益＋減価償却費）を発行済株式総数で割って求める。","1株当たりキャッシュフローは、（当期純利益－減価償却費）を発行済株式総数で割って求める。","減価償却費は足す。"],
  ["株価キャッシュフロー倍率（PCFR）は、株価を1株当たりキャッシュフローで割って求める。","株価キャッシュフロー倍率（PCFR）は、株価を1株当たり当期純利益で割って求める。","後者はPER。"],
  ["株価純資産倍率（PBR）は株価を1株当たり純資産で割って求め、PBRが1倍なら株価は解散価値と同水準といえる。","PBRが1倍のとき、株価は解散価値の2倍の水準といえる。","1倍＝解散価値と同水準。"],
  ["1株当たり純資産は、（総資産－総負債）を発行済株式総数で割って求める。","1株当たり純資産は、総資産を発行済株式総数で割って求める。","純資産＝総資産－総負債。"],
  ["自己資本利益率（ROE）は、税引後当期純利益を期首・期末平均の自己資本で割って求める。","自己資本利益率（ROE）は、税引後当期純利益を総資本で割って求める。","総資本で割るのはROA。"],
  ["総資本利益率（ROA）は、当期純利益を総資本で割って求める。","総資本利益率（ROA）は、当期純利益を自己資本で割って求める。","自己資本で割るのはROE。"],
  ["EBITDAは、税引前利益＋支払利息＋減価償却費で求める。","EBITDAは、税引前利益－支払利息－減価償却費で求める。","すべて足し戻す。"],
  ["EVは、時価総額＋有利子負債－現金預金－短期有価証券で求める。","EVは、時価総額－有利子負債＋現金預金で求める。","有利子負債は足し、現預金等は引く。"],
  ["EV/EBITDA倍率が高いほど株価は割高、低いほど割安と判断される。","EV/EBITDA倍率が高いほど株価は割安と判断される。","高い＝割高。"],
  ["株式の受渡金額は、買付けでは約定代金に手数料と消費税を加え、売付けでは約定代金から手数料と消費税を差し引いて求める。","株式の売付けの受渡金額は、約定代金に手数料と消費税を加えて求める。","売付けは差し引く。"],
  ["制度信用取引は、銘柄、品貸料、返済期限が取引所の規則により一律に定められた信用取引である。","制度信用取引では、返済期限を顧客と金融商品取引業者の間で自由に決めることができる。","自由に決められるのは一般信用取引。"],
  ["弁済期限などを顧客と金融商品取引業者の間で自由に決めることができるのは、一般信用取引である。","一般信用取引の弁済期限は、取引所の規則で6か月と定められている。","一般信用は当事者間で決める。"],
  ["東証の制度信用取引では、委託保証金の全額を代用有価証券で差し入れることができる。","制度信用取引の委託保証金は、少なくとも半分を現金で差し入れなければならない。","全額を代用有価証券にできる。"],
  ["相場の変動による計算上の利益相当額（評価益）を、金銭や有価証券として引き出したり、他の建株の委託保証金に充てたりすることは禁止されている。","信用取引の評価益は、他の建株の委託保証金に充当することができる。","評価益の引出し・充当は禁止。"],
  ["委託保証金の代用有価証券には、国債証券、地方債証券、国内の取引所に上場している外国国債証券などが含まれるが、国内CP、抵当証券、新株予約権証券は含まれない。","新株予約権証券は、委託保証金の代用有価証券として差し入れることができる。","新株予約権証券は代用不可。"],
  ["委託保証金の代用掛目は有価証券ごとに定められており、たとえば国債は100分の95、上場株券は100分の80である。","委託保証金の代用掛目は、上場株券が100分の95、国債が100分の80である。","国債95％、上場株券80％。"],
  ["制度信用取引の委託保証金の差入期限は、新規売買成立の日から起算して3営業日目の日の正午までの、金融商品取引業者が指定する日時である。","制度信用取引の委託保証金は、新規売買成立日の翌営業日の正午までに差し入れなければならない。","3営業日目の正午まで。"],
  ["東証の上場株式の信用取引では、委託保証金は約定価額の30％以上で、かつ最低30万円が必要である。","東証の上場株式の信用取引では、委託保証金は約定価額の20％以上で、最低50万円が必要である。","30％以上・最低30万円。"],
  ["信用取引で、相場の変動などにより委託保証金の額が建株の約定価額の20％を下回った場合は、追加保証金（追証）を差し入れなければならない。","委託保証金の額が建株の約定価額の30％を下回った時点で、追加保証金が必要になる。","維持率は20％。"],
  ["信用取引の金利は、買付代金を借りる買い方が負担する。","信用取引の金利は、株券を借りる売り方が負担する。","買い方が支払い、売り方は受け取る。"],
  ["信用取引貸株料は、信用取引の売り方が金融商品取引業者に支払う費用で、買い方に支払われるものではない。","信用取引貸株料は、売り方から徴収され買い方に支払われる。","業者に支払う費用。"],

<script>

const KEYS = {status:PFX+'status_map', wrong:PFX+'wrong_pool', custom:PFX+'custom_store', streak:PFX+'streak_map', star:PFX+'star_map', mode:PFX+'display_mode', backup:PFX+'last_backup'};

/* ===== 小道具 ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (a, b) => b ? Math.round(a / b * 1000) / 10 : 0;
const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
const norm = s => String(s || '').replace(/\s+/g, '');
function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function toHalf(s){ return String(s).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)); }
function toTop(){ window.scrollTo(0, 0); }

/* ===== 組み込みデータの展開（1章＝1モジュール） ===== */
const MODULES = {}, MODULE_KEYS = [];
DATA.forEach((d, idx) => {
  const num = idx + 1, key = 'ch' + num, rawFacts = [], bank = {};
  d.facts.forEach((f, i) => {
    const id = d.ch + '-' + i;
    rawFacts.push({id, text:f[0]});
    bank[id] = [
      {statement:f[0], isTrue:true,  explanation:f[2]},
      {statement:f[1], isTrue:false, explanation:f[2]}
    ];
  });
  MODULES[key] = {key, ch:d.ch, num, title:d.title, color:d.color, rawFacts, bank};
  MODULE_KEYS.push(key);
});
const scopeMods = s => s === ALL ? MODULE_KEYS : [s];
const chName = m => `第${MODULES[m].num}章`;
const chFull = m => `第${MODULES[m].num}章 ${MODULES[m].title}`;
const stampHTML = (m, cls) => m === ALL
  ? `<span class="stamp ${cls || ''}" style="--c:var(--ink)">全</span>`
  : `<span class="stamp ${cls || ''}" style="--c:${MODULES[m].color}">${MODULES[m].num}</span>`;
function chKeyFromNum(n){ n = +n; return n >= 1 && n <= MODULE_KEYS.length ? 'ch' + n : null; }
function modFromCh(v, fb){
  if(v == null || v === '') return fb;
  const r = toHalf(String(v)).match(/(\d+)/);
  return (r && chKeyFromNum(r[1])) || fb;
}

/* ===== 保存 ===== */
function load(k, def){ try{ const v = localStorage.getItem(k); if(v == null) return def; const p = JSON.parse(v); return p == null ? def : p; }catch(e){ return def; } }
let statusMap, wrongPool, customStore, streakMap, starMap;
function save(){
  try{
    localStorage.setItem(KEYS.status, JSON.stringify(statusMap));
    localStorage.setItem(KEYS.wrong, JSON.stringify(wrongPool));
    localStorage.setItem(KEYS.custom, JSON.stringify(customStore));
    localStorage.setItem(KEYS.streak, JSON.stringify(streakMap));
    localStorage.setItem(KEYS.star, JSON.stringify(starMap));
  }catch(e){ alert('保存できませんでした。ブラウザの保存容量が不足している可能性があります。'); }
}

/* ===== 旧版（4科目構成）のデータを章構成に移す ===== */
const LEGACY_DEFAULT = {hourei:'ch2', keizai:'ch4', kisoku:'ch6', gyomu:'ch8'};
function isLegacyKey(k){ const m = String(k).split(':')[0]; return Object.prototype.hasOwnProperty.call(LEGACY_DEFAULT, m); }
function migrate(d){
  const st = isObj(d.statusMap) ? d.statusMap : {}, sm = isObj(d.streakMap) ? d.streakMap : {};
  const wp = Array.isArray(d.wrongPool) ? d.wrongPool : [], cs0 = isObj(d.customStore) ? d.customStore : {};
  const legacy = Object.keys(cs0).some(k => LEGACY_DEFAULT[k]) || Object.keys(st).some(isLegacyKey) || wp.some(w => w && LEGACY_DEFAULT[w.moduleKey]);
  if(!legacy) return {statusMap:st, streakMap:sm, wrongPool:wp, customStore:cs0, migrated:false};
  const keyMap = Object.assign({}, LEGACY_MAP);          // 旧 "科目:ID" → 新 "章:ID"
  const ncs = {};
  const bucket = m => (ncs[m] = ncs[m] || {edits:{}, addedFacts:[], addedQuestions:[]});
  Object.keys(cs0).forEach(k => { if(!LEGACY_DEFAULT[k] && isObj(cs0[k])) ncs[k] = cs0[k]; });
  Object.keys(LEGACY_DEFAULT).forEach(om => {
    const c = cs0[om]; if(!isObj(c)) return;
    (Array.isArray(c.addedFacts) ? c.addedFacts : []).forEach(f => {
      const nm = modFromCh(f.ch, LEGACY_DEFAULT[om]);
      bucket(nm).addedFacts.push({id:f.id, ch:MODULES[nm].ch, text:f.text});
      keyMap[om + ':' + f.id] = nm + ':' + f.id;
    });
    if(isObj(c.edits)) Object.keys(c.edits).forEach(id => {
      const nk = keyMap[om + ':' + id]; if(!nk) return;
      const [nm, nid] = nk.split(':'); bucket(nm).edits[nid] = c.edits[id];
    });
    (Array.isArray(c.addedQuestions) ? c.addedQuestions : []).forEach(q => {
      const nk = keyMap[om + ':' + q.factId]; if(!nk) return;
      const [nm, nid] = nk.split(':');
      bucket(nm).addedQuestions.push({factId:nid, ch:MODULES[nm].ch, statement:q.statement, isTrue:q.isTrue, explanation:q.explanation});
    });
  });
  const remap = obj => { const o = {}; Object.keys(obj).forEach(k => { if(!isLegacyKey(k)){ o[k] = obj[k]; return; } const nk = keyMap[k]; if(nk) o[nk] = obj[k]; }); return o; };
  const nwp = [];
  wp.forEach(w => {
    if(!w) return;
    if(!LEGACY_DEFAULT[w.moduleKey]){ nwp.push(w); return; }
    const nk = keyMap[w.moduleKey + ':' + w.factId]; if(!nk) return;
    const [nm, nid] = nk.split(':');
    nwp.push(Object.assign({}, w, {moduleKey:nm, factId:nid, ch:MODULES[nm].ch}));
  });
  return {statusMap:remap(st), streakMap:remap(sm), wrongPool:nwp, customStore:ncs, migrated:true};
}
function loadAll(){
  const r = migrate({statusMap:load(KEYS.status, {}), wrongPool:load(KEYS.wrong, []), customStore:load(KEYS.custom, {}), streakMap:load(KEYS.streak, {})});
  statusMap = r.statusMap; wrongPool = r.wrongPool; customStore = r.customStore; streakMap = r.streakMap;
  starMap = load(KEYS.star, {}); if(!isObj(starMap)) starMap = {};
  if(r.migrated){ save(); setTimeout(() => toast('これまでの進捗を章ごとの構成に引き継ぎました'), 600); }
}
loadAll();

/* ===== データ参照 ===== */
function cs(m){
  let c = customStore[m];
  if(!isObj(c)) c = customStore[m] = {};
  if(!isObj(c.edits)) c.edits = {};
  if(!Array.isArray(c.addedFacts)) c.addedFacts = [];
  if(!Array.isArray(c.addedQuestions)) c.addedQuestions = [];
  return c;
}
function getFacts(m){
  const c = cs(m);
  const out = MODULES[m].rawFacts.map(f => {
    const edited = Object.prototype.hasOwnProperty.call(c.edits, f.id);
    return {m, id:f.id, text: edited ? c.edits[f.id] : f.text, edited, custom:false};
  });
  c.addedFacts.forEach(f => out.push({m, id:f.id, text:f.text, edited:false, custom:true}));
  return out;
}
const scopeFacts = s => scopeMods(s).flatMap(getFacts);
function findFact(m, id){ return MODULES[m] ? getFacts(m).find(f => f.id === id) || null : null; }
function questionsFor(f){
  const added = cs(f.m).addedQuestions.filter(q => q.factId === f.id);
  if(f.custom || f.edited) return added;
  return (MODULES[f.m].bank[f.id] || []).concat(added);
}
const sk = (m, id) => m + ':' + id;
function st(m, id){ return statusMap[sk(m, id)] || 'unseen'; }
const isStar = (m, id) => !!starMap[sk(m, id)];
function toggleStar(m, id){ const k = sk(m, id); if(starMap[k]) delete starMap[k]; else starMap[k] = true; save(); return !!starMap[k]; }
const starFacts = s => scopeFacts(s).filter(f => isStar(f.m, f.id));
const starBtn = (m, id, cls, long) => { const on = isStar(m, id); return `<button class="star-btn${on ? ' on' : ''}${cls ? ' ' + cls : ''}" data-act="star" data-m="${m}" data-id="${esc(id)}" data-long="${long ? 1 : ''}" aria-label="直前チェック">${long ? (on ? '★ 直前チェック済み' : '☆ 直前チェックに追加') : (on ? '★' : '☆')}</button>`; };
function setSt(m, id, s){
  const k = sk(m, id);
  if(s === 'unseen') delete statusMap[k]; else statusMap[k] = s;
  streakMap[k] = 0;
}
function tally(facts){
  let known = 0, weak = 0;
  facts.forEach(f => { const s = st(f.m, f.id); if(s === 'known') known++; else if(s === 'weak') weak++; });
  return {facts, total:facts.length, known, weak, unseen:facts.length - known - weak};
}
const counts = s => tally(scopeFacts(s));
function poolCount(s){ const ms = scopeMods(s); return wrongPool.filter(w => ms.includes(w.moduleKey)).length; }
function newCustomId(){
  const ids = new Set(); MODULE_KEYS.forEach(k => cs(k).addedFacts.forEach(f => ids.add(f.id)));
  let t = Date.now(); while(ids.has('CUSTOM-' + t)) t++;
  return 'CUSTOM-' + t;
}

/* ===== 画面状態 ===== */

const freshUI = () => ({view:'dash', quiz:null, result:null, filter:'all', search:''});
[ALL].concat(MODULE_KEYS).forEach(s => ui[s] = freshUI());
let lastAddCh = 'ch1';

/* ===== ナビ（パネルの有無に関係なく常に更新） ===== */
function navRow(s, cls){

function switchScope(s){

}
function openPicker(){

/* ===== パネル ===== */
function renderPanel(s){
  const p = $('#panel'); if(!p) return;
  const u = ui[s], c = counts(s);
  const tabs = [['dash','ホーム'],['items','項目を見る'],['quiz','クイズ'],['result','結果']]

function emptyHTML(t, sub){

function chapterTable(s){

/* --- ホーム --- */

  if(s !== ALL && !c.total){
    return `<div class="card empty"><p><b>この章にはまだ項目がありません。</b></p>

      <div class="add-row"><button class="btn" data-act="add-fact">＋ 項目を追加</button><button class="btn" data-act="bulk">📋 まとめて追加</button></div></div>

        <div class="stat weak"><b>${c.weak}</b><span>苦手</span></div>
        <div class="stat unseen"><b>${c.unseen}</b><span>未学習</span></div>
      </div>
      <div class="bar big"><i class="k" style="width:${pct(c.known, c.total)}%"></i><i class="w" style="width:${pct(c.weak, c.total)}%"></i></div>
      <div class="legend"><span style="--lc:var(--seal)">分かった</span><span style="--lc:var(--hanko)">苦手</span><span style="--lc:var(--paper-deep)">未学習</span></div>
    </div>
    <div class="sec-h">${s === ALL ? '全章からクイズ' : esc(chName(s)) + 'のクイズ'}</div>
    <div class="start-grid">
      ${btn('all', '全項目から', c.total, qn(c.total), true)}
      ${btn('weak', '苦手から', c.weak, qn(c.weak))}
      ${btn('unseen', '未学習から', c.unseen, qn(c.unseen))}
      ${btn('review', '復習（間違えた問題）', pool, Math.min(MAX_Q, pool))}
    </div>
    ${(() => { const n = starFacts(s).length; return `<button class="btn start-btn star-start block mt" data-act="start" data-mode="star"${n ? '' : ' disabled'}>★ 直前チェック<small>${n ? `星を付けた ${n}項目を1問ずつ・全部出題` : '項目や問題の☆を押すと、ここで出題されます'}</small></button>`; })()}
    ${s === ALL ? `<div class="sec-h">章ごとの定着度</div><div class="card ch-card">${chapterTable(s)}</div>` : navArrows(s)}`;
}
function navArrows(s){
  const i = MODULE_KEYS.indexOf(s), prev = MODULE_KEYS[i - 1], next = MODULE_KEYS[i + 1];
  return `<div class="arrows">
    ${prev ? `<button class="btn" data-act="scope" data-s="${prev}">← ${esc(chName(prev))}</button>` : '<span></span>'}
    <button class="btn" data-act="scope" data-s="${ALL}">全章</button>
    ${next ? `<button class="btn" data-act="scope" data-s="${next}">${esc(chName(next))} →</button>` : '<span></span>'}</div>`;
}

/* --- 項目を見る --- */
function itemsShellHTML(s){
  return `<input class="search" type="search" placeholder="項目を検索" data-search="${s}" value="${esc(ui[s].search)}">
    <div id="item-list"></div>
    <div class="add-row"><button class="btn" data-act="add-fact">＋ 新しい項目を追加</button><button class="btn" data-act="bulk">📋 まとめて追加</button></div>`;
}
function renderItemList(s){
  const box = $('#item-list'); if(!box) return;
  const u = ui[s], facts = scopeFacts(s);
  const cnt = {all:facts.length, weak:0, known:0, unseen:0, star:0};
  facts.forEach(f => { cnt[st(f.m, f.id)]++; if(isStar(f.m, f.id)) cnt.star++; });
  const q = norm(u.search);
  const shown = facts.filter(f => (u.filter === 'all' || (u.filter === 'star' ? isStar(f.m, f.id) : st(f.m, f.id) === u.filter)) && (!q || norm(f.text).includes(q)));
  const chips = [['all','すべて'],['star','★'],['weak','苦手'],['known','分かった'],['unseen','未学習']]
    .map(([f, l]) => `<button class="chip${u.filter === f ? ' active' : ''}" data-act="filter" data-f="${f}">${l} ${cnt[f]}</button>`).join('');
  let html = `<div class="chips">${chips}</div>`;
  if(!shown.length) html += `<p class="muted">該当する項目はありません。</p>`;
  scopeMods(s).forEach(m => {
    const fs = shown.filter(f => f.m === m); if(!fs.length) return;
    if(s === ALL) html += `<div class="ch-head">${stampHTML(m, 'sm')}${esc(chFull(m))}（${fs.length}）</div>`;
    fs.forEach(f => {
      const stt = st(m, f.id), qs = questionsFor(f);
      const noX = !qs.some(x => !x.isTrue);
      html += `<div class="item s-${stt}">
        <div class="item-top">${f.custom ? '<span class="tag c">自作</span>' : `<span>${esc(f.id)}</span>`}${f.edited ? '<span class="tag c">編集済</span>' : ''}<span class="tag">問題 ${qs.length}</span>${noX ? '<span class="tag warn">×問題なし</span>' : ''}</div>
        <div class="item-text">${esc(f.text)}</div>
        <div class="item-actions"><div class="seg">${['weak','known','unseen'].map(x => `<button class="${x}${stt === x ? ' on' : ''}" data-act="setst" data-m="${m}" data-id="${esc(f.id)}" data-st="${x}">${STATUS_LABEL[x]}</button>`).join('')}</div>
        ${starBtn(m, f.id)}<button class="edit-btn" data-act="edit" data-m="${m}" data-id="${esc(f.id)}">編集</button></div></div>`;
    });
  });
  box.innerHTML = html;
}

/* --- クイズ --- */
function generateQuiz(s, mode){
  const ms = scopeMods(s);
  if(mode === 'review'){
    return shuffle(wrongPool.filter(w => ms.includes(w.moduleKey))).slice(0, MAX_Q)
      .map(w => ({m:w.moduleKey, factId:w.factId, statement:w.statement, isTrue:!!w.isTrue, explanation:w.explanation || ''}));
  }
  if(mode === 'star'){
    const out = [];
    starFacts(s).forEach(f => { const c = questionsFor(f); if(!c.length) return; const q = c[Math.floor(Math.random() * c.length)]; out.push({m:f.m, factId:f.id, statement:q.statement, isTrue:!!q.isTrue, explanation:q.explanation || ''}); });
    return out;
  }
  const facts = scopeFacts(s).filter(f => mode === 'all' || st(f.m, f.id) === mode);
  const qs = [];
  facts.forEach(f => questionsFor(f).forEach(q => qs.push({m:f.m, factId:f.id, statement:q.statement, isTrue:!!q.isTrue, explanation:q.explanation || ''})));
  return shuffle(qs).slice(0, Math.min(MAX_Q, facts.length * 2));
}
function startQuiz(s, mode){
  const u = ui[s];
  if(u.quiz && u.quiz.answers.length && !confirm('途中のクイズがあります。新しく始めると、途中までの回答は記録されません。よろしいですか？')) return;
  const qs = generateQuiz(s, mode);
  if(!qs.length){ alert('出題できる問題がありません。'); return; }
  u.quiz = {mode, questions:qs, idx:0, answers:[], answered:null};
  u.view = 'quiz'; renderPanel(s); toTop();
}
function quizHTML(s){
  const q = ui[s].quiz;
  if(!q) return emptyHTML('実施中のクイズはありません。', 'ホームの「クイズを始める」から開始してください。');
  const cur = q.questions[q.idx], n = q.questions.length, done = q.idx + (q.answered ? 1 : 0);
  const M = MODULES[cur.m];
  let h = `<div class="q-meta"><span>${s === ALL ? '全章' : esc(chName(s))}・${MODE_LABEL[q.mode]}モード</span><span>${q.idx + 1} / ${n} 問</span></div>
    <div class="bar"><i class="p" style="width:${pct(done, n)}%"></i></div>
    <div class="card q-card" style="--c:${M.color}">
      <div class="q-ch"><span class="q-chno">${esc(chName(cur.m))}</span><span class="q-chtitle">${esc(M.title)}</span>${starBtn(cur.m, cur.factId, 'q-star')}</div>
      <div class="q-st">${esc(cur.statement)}</div></div>`;
  if(!q.answered){
    h += `<div class="ans-grid"><button class="ans o" data-act="ans" data-v="o" aria-label="正しい">○</button><button class="ans x" data-act="ans" data-v="x" aria-label="誤り">×</button><button class="ans skip" data-act="ans" data-v="s">分からない</button></div>`;
  }else{
    const a = q.answered, f = findFact(cur.m, cur.factId);
    const cls = a.skip ? 'sk' : a.correct ? 'ok' : 'ng';
    const head = a.skip ? '分からない' : a.correct ? '正解！' : '不正解…';
    h += `<div class="fb ${cls}"><div class="fb-h">${head}</div>
      <div class="fb-ans">正しい答え：<b>${cur.isTrue ? '○（正しい）' : '×（誤り）'}</b></div>
      ${cur.explanation ? `<div class="fb-ex">${esc(cur.explanation)}</div>` : ''}
      ${f && f.text !== cur.statement ? `<div class="fb-fact"><b>覚える内容（${esc(chFull(cur.m))}）</b>${esc(f.text)}</div>` : ''}
      <div class="fb-star">${starBtn(cur.m, cur.factId, '', true)}</div></div>
      <button class="btn primary block next" data-act="next">${q.idx >= n - 1 ? '結果を見る' : '次の問題へ'}</button>`;
  }
  return h + `<button class="quit" data-act="quit">ここで終了する</button>`;
}
function answer(s, v){
  const q = ui[s].quiz; if(!q || q.answered) return;
  const cur = q.questions[q.idx], skip = v === 's';
  const correct = !skip && ((v === 'o') === cur.isTrue);
  q.answered = {v, correct, skip};
  q.answers.push({q:cur, correct, skip});
  renderPanel(s);
  const card = document.querySelector('#panel .q-card');
  if(card){ const y = card.getBoundingClientRect().top + window.scrollY - 70; if(y < window.scrollY) window.scrollTo({top:Math.max(0, y), behavior:'smooth'}); }
}
function nextQ(s){
  const q = ui[s].quiz; if(!q || !q.answered) return;
  if(q.idx >= q.questions.length - 1){ finishQuiz(s); return; }
  q.idx++; q.answered = null; renderPanel(s); toTop();
}
function quitQuiz(s){
  const q = ui[s].quiz; if(!q) return;
  if(!q.answers.length){
    if(!confirm('クイズを中止しますか？')) return;
    ui[s].quiz = null; ui[s].view = 'dash'; renderPanel(s); toTop(); return;
  }
  if(confirm(`ここまでの ${q.answers.length}問 の回答で結果を出しますか？`)) finishQuiz(s);
}
function finishQuiz(s){
  const q = ui[s].quiz; if(!q) return;
  const promoted = [], added = [], wrong = [], byCh = {}; let correct = 0;
  q.answers.forEach(a => {
    const m = a.q.m, k = sk(m, a.q.factId);
    byCh[m] = byCh[m] || {n:0, ok:0}; byCh[m].n++;
    if(a.correct){
      correct++; byCh[m].ok++;
      wrongPool = wrongPool.filter(w => !(w.moduleKey === m && w.statement === a.q.statement));
      const n = (streakMap[k] || 0) + 1;
      if(n >= 2 && statusMap[k] !== 'known'){
        statusMap[k] = 'known'; streakMap[k] = 0;
        const f = findFact(m, a.q.factId);
        if(f && !promoted.some(p => p.m === m && p.id === f.id)) promoted.push(f);
      }else streakMap[k] = n;
    }else{
      statusMap[k] = 'weak'; streakMap[k] = 0; wrong.push(a);
      if(!wrongPool.some(w => w.moduleKey === m && w.statement === a.q.statement)){
        wrongPool.push({id:Date.now() + '-' + Math.random().toString(36).slice(2, 7), factId:a.q.factId, statement:a.q.statement, isTrue:a.q.isTrue, explanation:a.q.explanation, ch:MODULES[m].ch, moduleKey:m, isSkip:a.skip});
        added.push(a.q);
      }
    }
  });
  ui[s].result = {mode:q.mode, total:q.answers.length, correct, promoted, added, wrong, byCh};
  ui[s].quiz = null; ui[s].view = 'result';
  save(); refreshAllModuleCounts(); renderPanel(s); toTop();
}

/* --- 結果 --- */
function resultHTML(s){
  const r = ui[s].result;
  if(!r) return emptyHTML('まだ結果はありません。', 'クイズを解くと、ここに結果が表示されます。');
  const rate = r.total ? Math.round(r.correct / r.total * 100) : 0, pool = poolCount(s);
  const chs = MODULE_KEYS.filter(m => r.byCh[m]);
  const chTable = chs.length > 1 ? `<div class="sec-h">章ごとの正答</div><div class="card">${chs.map(m => {
      const b = r.byCh[m];
      return `<div class="rc-row">${stampHTML(m, 'sm')}<span class="rc-name">${esc(chFull(m))}</span><span class="rc-num${b.ok < b.n ? ' ng' : ''}">${b.ok} / ${b.n}</span></div>`;
    }).join('')}</div>` : '';
  const pro = r.promoted.length
    ? `<ul class="rlist">${r.promoted.map(f => `<li><span class="tag">${esc(chName(f.m))}</span> ${esc(f.text)}</li>`).join('')}</ul>`
    : '<p class="muted">今回はありません（同じ項目を2回続けて正解すると昇格します）</p>';
  const wr = r.wrong.length
    ? `<ul class="rlist">${r.wrong.map(a => `<li><span class="mk ${a.q.isTrue ? 'o' : 'x'}">正解 ${a.q.isTrue ? '○' : '×'}</span><span class="tag">${esc(chName(a.q.m))}</span>${a.skip ? ' <span class="tag">分からない</span>' : ''} ${esc(a.q.statement)}</li>`).join('')}</ul>`
    : '<p class="muted">全問正解です！</p>';
  return `<div class="card score"><div class="big">${r.correct} / ${r.total}</div><div class="rate">正答率 ${rate}%</div></div>
    ${chTable}
    <div class="sec-h">「分かった」に昇格した項目（${r.promoted.length}）</div><div class="card">${pro}</div>
    <div class="sec-h">間違えた・分からなかった問題（${r.wrong.length}）</div>
    <div class="card">${wr}${r.added.length ? `<p class="note">うち ${r.added.length}問 を復習プールに追加しました。</p>` : ''}</div>
    <div class="start-grid">
      <button class="btn start-btn primary" data-act="start" data-mode="${r.mode}">もう一度<small>同じ条件で出題</small></button>
      <button class="btn start-btn" data-act="start" data-mode="review"${pool ? '' : ' disabled'}>復習する<small>間違えた問題 ${pool}問</small></button>
    </div>
    <button class="btn block mt" data-act="tab" data-v="dash">ホームへ</button>`;
}

/* ===== モーダル ===== */
function openModal(html, dismiss){
  const ov = $('#overlay');
  $('#modal').innerHTML = html; $('#modal').scrollTop = 0;
  ov.dataset.dismiss = dismiss ? '1' : '0';
  ov.classList.remove('hidden'); document.body.classList.add('noscroll');
}
function closeModal(){
  $('#overlay').classList.add('hidden'); document.body.classList.remove('noscroll');
  $('#modal').innerHTML = ''; editing = null; bulkPending = null;
}
let toastTimer = null;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('hidden'), 2600);
}
function copyText(s, msg){

function toBool(v){
  if(v === true || v === false) return v;
  const s = String(v == null ? '' : v).trim().toLowerCase();
  if(['true','○','〇','o','1','正','正しい','yes'].includes(s)) return true;
  if(['false','×','x','✕','0','誤','誤り','no'].includes(s)) return false;
  return null;
}
function fromPack(obj, fb){
  if(obj && obj.__type === SYNC_TYPE) throw new Error('これは進捗ファイルです。メニューの「ファイルから読み込む」を使ってください。');
  const arr = Array.isArray(obj) ? obj : (obj && (obj.items || obj.facts));
  if(!Array.isArray(arr)) throw new Error('問題パックの形式ではありません（items の配列が見つかりません）。');
  return arr.map(it => {
    if(!it) return null;
    const text = String(it.text || it.fact || '').trim(); if(!text) return null;
    const m = modFromCh(it.ch || it.chapter, fb);
    const qs = (Array.isArray(it.questions) ? it.questions : []).map(q => ({
      statement:String(q && (q.statement || q.q) || '').trim(),
      isTrue:toBool(q && ('isTrue' in q ? q.isTrue : q.answer)),
      explanation:String(q && (q.explanation || q.exp) || '').trim()
    })).filter(q => q.statement && q.isTrue !== null);
    return {m, text, questions:qs.length ? qs : null};
  }).filter(Boolean);
}
function parseBulk(raw, fb){
  const t = String(raw).replace(/^﻿/, '').trim();
  if(/^(```|\{|\[)/.test(t)) return fromPack(parseJSONLoose(t), fb);
  const lines = t.replace(/。[ \t　]*・/g, '。\n・').split(/\r?\n/);
  let m = null, cur = null; const out = [];
  lines.forEach(rawLine => {
    const line = rawLine.trim(); if(!line){ cur = null; return; }
    const h = toHalf(line).match(/^第\s*(\d+)\s*章/);
    if(h){ m = chKeyFromNum(h[1]); cur = null; return; }
    const b = line.match(/^[・･\-－−•\*＊。．]\s*/);
    if(b){ const body = line.slice(b[0].length).trim(); if(!body){ cur = null; return; } cur = {m, text:body}; out.push(cur); }
    else if(cur) cur.text += '\n' + line;
  });
  return out.map(it => ({m: it.m || fb, text: it.text, questions: null}));
}
function bulkParse(){
  const raw = $('#bk-text').value, fb = $('#bk-mod').value, box = $('#bk-preview');

  const ok = [], dup = [];

  bulkPending = ok;

}

function parseJSONLoose(text){
  const raw = String(text);
  try{ return JSON.parse(raw); }catch(e){}
  let s = raw.replace(/^﻿/, '').trim().replace(/^```[\w-]*\s*/, '').replace(/\s*```\s*$/, '');
  const a = s.search(/[\{\[]/), b = Math.max(s.lastIndexOf('}'), s.lastIndexOf(']'));
  if(a >= 0 && b > a) s = s.slice(a, b + 1);
  try{ return JSON.parse(s); }catch(e){}
  s = s.replace(/[“”„‟″＂]/g, '"').replace(/[‘’‚‛]/g, "'");
  try{ return JSON.parse(s); }catch(e){}
  const s2 = s.replace(/｛/g, '{').replace(/｝/g, '}').replace(/［/g, '[').replace(/］/g, ']').replace(/：/g, ':').replace(/，/g, ',');
  try{ return JSON.parse(s2); }
  catch(e){ throw new Error(`JSONとして読めませんでした（${raw.length.toLocaleString()}文字）。\n末尾：…${raw.trim().slice(-40)}\nエラー：${e.message}\n途中で切れている場合は「ファイルに保存」→「ファイルから読み込む」を使ってください。`); }
}

  return `<div class="menu-sec"><div class="menu-h">進捗の同期（PC ⇔ スマホ）</div>
      <button class="menu-btn" data-act="exp-file">💾 進捗をファイルに保存</button>
      <label class="menu-btn">📂 ファイルから読み込む<input type="file" class="vh" data-file="sync" accept=".json,application/json,text/plain"></label>
      <button class="menu-btn" data-act="exp-text">📋 進捗をテキストでコピー</button>
      <button class="menu-btn" data-act="imp-text">📥 テキストを貼り付けて読み込む</button>
      ${backupNote()}</div>
    <div class="menu-sec"><div class="menu-h">苦手項目だけ受け渡す</div>
      <button class="menu-btn" data-act="weak-exp">苦手項目を書き出す</button>
      <button class="menu-btn" data-act="weak-imp">苦手項目をインポート</button></div>
    <div class="menu-sec"><div class="menu-h">★ 直前チェック</div>
      <button class="menu-btn" data-act="star-exp">★ 直前チェック項目を書き出す</button></div>
    <div class="menu-sec"><div class="menu-h">問題を増やす</div>
      <button class="menu-btn" data-act="add-fact">＋ 項目を1件追加</button>
      <button class="menu-btn" data-act="bulk">📋 まとめて追加（メモ・問題パック）</button></div>
    <div class="menu-sec"><button class="menu-btn danger" data-act="reset">全データをリセット</button></div>`;
}
function openMenu(){ openModal(`<div class="handle"></div><h3>メニュー</h3>${menuHTML()}<button class="btn block" data-act="close">閉じる</button>`, true); }

/* ===== 表示モード ===== */
function isMobile(){ return document.documentElement.classList.contains('mode-mobile'); }
function updateModeBtn(){ $('#modeBtn').textContent = isMobile() ? '🖥 PC版' : '📱 スマホ版'; }
function toggleMode(){
  const nm = isMobile() ? 'desktop' : 'mobile';
  document.documentElement.className = 'mode-' + nm;
  try{ localStorage.setItem(KEYS.mode, nm); }catch(e){}
  updateModeBtn();
}

/* ===== イベント ===== */
document.addEventListener('click', e => {
  const ov = $('#overlay');
  if(e.target === ov){ if(ov.dataset.dismiss === '1') closeModal(); return; }
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const d = el.dataset, s = curScope;
  switch(d.act){
    case 'scope': if(!$('#overlay').classList.contains('hidden')) closeModal(); switchScope(d.s); break;
    case 'picker': openPicker(); break;
    case 'menu': openMenu(); break;
    case 'tab': ui[s].view = d.v; renderPanel(s); toTop(); break;
    case 'start': startQuiz(s, d.mode); break;
    case 'ans': answer(s, d.v); break;
    case 'next': nextQ(s); break;
    case 'quit': quitQuiz(s); break;
    case 'star': { const on = toggleStar(d.m, d.id); if(d.long) el.textContent = on ? '★ 直前チェック済み' : '☆ 直前チェックに追加'; else el.textContent = on ? '★' : '☆'; el.classList.toggle('on', on); document.querySelectorAll(`.star-btn[data-m="${d.m}"][data-id="${CSS.escape(d.id)}"]`).forEach(b => { if(b === el) return; b.classList.toggle('on', on); b.textContent = b.dataset.long ? (on ? '★ 直前チェック済み' : '☆ 直前チェックに追加') : (on ? '★' : '☆'); }); toast(on ? '直前チェックに追加しました' : '直前チェックから外しました'); break; }
    case 'star-exp': starExport(); break;
    case 'setst': setSt(d.m, d.id, d.st); save(); refreshAllModuleCounts(); renderPanel(s); break;
    case 'filter': ui[s].filter = d.f; renderItemList(s); break;
    case 'edit': openEditor(d.m, d.id); break;
    case 'add-fact': openEditor(null, null); break;
    case 'bulk': openBulk(); break;
    case 'close': closeModal(); break;
    case 'ed-addq': $('#ed-qs').insertAdjacentHTML('beforeend', qRow({statement:'', isTrue:false, explanation:''})); break;
    case 'ed-delq': el.closest('.ed-q').remove(); break;
    case 'ed-save': saveEditor(); break;
    case 'ed-del': deleteFact(); break;
    case 'ed-revert': revertFact(); break;
    case 'bk-parse': bulkParse(); break;
    case 'bk-commit': bulkCommit(); break;
    case 'bk-prompt': copyText(PACK_PROMPT, '依頼文をコピーしました。Claudeに貼り、続けてメモを貼ってください'); break;
    case 'exp-file': exportFile(); break;
    case 'exp-text': exportText(); break;
    case 'imp-text': openPasteImport(); break;
    case 'imp-text-go': importFromText($('#imp-area').value); break;
    case 'weak-exp': weakExport(); break;
    case 'weak-imp': openWeakImport(); break;
    case 'weak-imp-go': weakImportGo(); break;
    case 'copy-area': { const t = $('#tx-area'); t.removeAttribute('readonly'); t.select(); t.setSelectionRange(0, t.value.length); let ok = false; try{ ok = document.execCommand('copy'); }catch(err){} t.setAttribute('readonly', ''); if(ok) toast('コピーしました'); else copyText(t.value); break; }
    case 'reset': resetAll(); break;
    case 'toggle-mode': toggleMode(); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(!t.matches || !t.matches('input[type=file][data-file]')) return;
  const f = t.files && t.files[0]; if(!f) return;
  const kind = t.dataset.file, r = new FileReader();
  r.onload = () => {
    t.value = '';
    if(kind === 'sync'){ closeModal(); importFromText(String(r.result)); }
    else { const ta = $('#bk-text'); if(ta){ ta.value = String(r.result); toast(`${f.name} を読み込みました`); bulkParse(); } }
  };
  r.onerror = () => alert('ファイルを読み込めませんでした。');
  r.readAsText(f, 'utf-8');
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset && t.dataset.search){ ui[t.dataset.search].search = t.value; renderItemList(t.dataset.search); }
});
document.addEventListener('keydown', e => {
  if(!$('#overlay').classList.contains('hidden')) return;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const u = ui[curScope]; if(u.view !== 'quiz' || !u.quiz) return;
  const k = e.key.toLowerCase();
  if(!u.quiz.answered){
    if(k === 'o' || k === '1') answer(curScope, 'o');
    else if(k === 'x' || k === '2') answer(curScope, 'x');
    else if(k === 's' || k === '3') answer(curScope, 's');
  }else if(k === 'enter' || k === ' '){ e.preventDefault(); nextQ(curScope); }
});

/* ===== 起動 ===== */
$('#main').innerHTML = '<section class="panel" id="panel"></section>';
updateModeBtn();
renderAll();

</script>
</body>
</html>
